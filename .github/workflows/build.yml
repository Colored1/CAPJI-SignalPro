name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Keeps the debug signature stable between runs so a new APK can update the old one.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: capji-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            summary=$(grep -E -A6 '^e: |error:|ERROR:|\* What went wrong|FAILED|Test.*FAIL' build.log | head -c 6000)
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::${summary}"
          fi

      - name: Check 16 KB native library alignment
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          rm -rf apk-libs && mkdir apk-libs
          unzip -q "$apk" 'lib/arm64-v8a/*' -d apk-libs || true
          bad=""
          for so in apk-libs/lib/arm64-v8a/*.so; do
            [ -e "$so" ] || continue
            for align in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if (( align < 0x4000 )); then bad="$bad $(basename "$so")"; break; fi
            done
          done
          if [ -n "$bad" ]; then
            echo "::warning title=16KB alignment::Not 16 KB aligned:$bad"
          else
            echo "::notice title=16KB alignment::All arm64-v8a libraries are 16 KB aligned"
          fi
          size=$(du -h "$apk" | cut -f1)
          echo "::notice title=APK::app-debug.apk built successfully ($size)"

      - uses: actions/upload-artifact@v4
        with:
          name: CAPJI-SignalPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "CAPJI Signal Pro 1.0.${{ github.run_number }}" \
            --notes "نسخة تجريبية (debug). حمّل ملف app-debug.apk وثبّته على هاتف أندرويد 8 أو أحدث." \
            --latest
