name: Smoke test

on:
  push:
    branches: [ ci/smoke-test ]

permissions:
  contents: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-${{ matrix.api }};google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" "$image" emulator platform-tools > /dev/null
          echo no | "$tools/avdmanager" create avd --force -n smoke -k "$image" -d pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -camera-back virtualscene -memory 3072 > emulator.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 420 "$adb" wait-for-device || { tail -40 emulator.log; exit 1; }
          for i in $(seq 1 150); do
            [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 3
          done
          sleep 25
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Drive the app
        run: python3 .github/smoke/smoke.py app-debug.apk "shots/api${{ matrix.api }}" ${{ matrix.api }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shots-${{ matrix.api }}
          path: shots

  publish-shots:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: shots-*
          path: screenshots
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          git commit -m "Smoke test screenshots for run ${{ github.run_number }}" || exit 0
          git push
